<div class="dashboard-container">
  <app-sidebar></app-sidebar>

  <div class="profile-container">
    <app-header></app-header>

    <div class="notificacoes-page">
      <h2>Minhas Notificações</h2>

      <div *ngIf="notificacoes.length > 0; else semNotificacoes">
        <div class="notificacao" *ngFor="let notif of notificacoes">
          <p>{{ notif.texto }}</p>
          <small>
            {{ notif.dataNotificacao | date:"MMMM d, y 'às' HH:mm":'en-US' }}
          </small>
          <small *ngIf="notif.dataDevolucao" style="font-weight: bold; color: rgba(31,64,64,0.8) ;">
            • Devolução prevista para
            {{ notif.dataDevolucao | date:"MMMM d, y 'às' HH:mm":'en-US' }}
          </small>
        </div>
      </div>

      <ng-template #semNotificacoes>
        <p>Você não possui notificações no momento.</p>
      </ng-template>
    </div>
  </div>
</div>
